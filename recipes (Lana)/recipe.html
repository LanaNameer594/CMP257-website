<!DOCTYPE html>
<html>
    <head>
        <title>Shopping List</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>        
        <link rel="stylesheet" href="recipe.css">
    </head>
    <body>
      <header class="nav_style">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand title_font" href="../home/index.html">The Cookbook</a>
                <button class="navbar-toggler nav_style" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link nav_style" href="recipe.html">Recipes</a>
                        <a class="nav-link nav_style" href="../shopping_list/shopping_list.html">Shopping List</a>
                        <a class="nav-link nav_style" href="../home/index.html">My Profile</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
	<main class="recipes-page">

	  <section class="board-back">
	    <section class="board-front">
	
	      <div class="board-header">
	        <img src="background/patch.png" class="patch" alt="Recipes">
	
	        <button class="search-button" type="button" aria-label="Search recipes">
	          <img src="btn/search.png" class="search" id="search-btn" alt="Search">
	        </button>
	      </div>
		
		  <div class="results-header" id="results-header">
  			<h2>Featured Recipes</h2>
  		    <p>Search or browse our cookbook.</p>
		  </div>
		  
	      <div class="image-grid">
			<p class="no-results-message">Loading featured recipes...</p>
	      </div>
	
	    </section>
	  </section>
	
	</main>
          
    <div id="pickModal" class="modal">
    	<div class="modal-content">
    	<form id="search-form">
        	<h1>Search Recipes</h1>

            <div class="search-input-group">
                <input type="text" id="search-input" placeholder="What are you craving? ">
            </div>
            
            <div class="keyword-group">
                <p>Popular Keywords:</p>
                <div class="keywords">
                	<span class="keyword-tag">Breakfast</span>
                    <span class="keyword-tag">Vegan</span>
                    <span class="keyword-tag">Dessert</span>
                    <span class="keyword-tag">Quick and Easy</span>
                    <span class="keyword-tag">Dinner</span>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">Search Recipes</button>
            </form>
            <button class="modal-close" type="button">x</button>
        </div>
    </div>
          
	<div id="recipeModal" class="modal">
		<div class="modal-content cork-theme">
			<span class="close-btn">&times;</span>
				<div id="modalBody">
			    </div>
		</div>
	</div>
	<script src="recipe.js"></script>
</body>
</html>
