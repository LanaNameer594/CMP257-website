      <header class="nav_style">

                    <div class="navbar-nav ms-auto">

    <img src="background/patch.png" class="patch">
    <img src="background/cork.png" class="cork">
        <div class="container">
            <div class="image-grid">
          
              <div class="card">
                <img src="rpics/p1.png" alt="Description 1" class="grid-pic">
                <img src="rcards/pic1.png" alt="Description 1" class="overlay">

                
              </div>
          
              <div class="card">
                <img src="rpics/p2.png" alt="Description 2" class="grid-pic">
                <img src="rcards/pic2.png" alt="Description 1" class="overlay">

                
              
              </div>
          
              <div class="card">
                <img src="rpics/p3.png" alt="Description 3" class="grid-pic">
                <img src="rcards/pic3.png" alt="Description 1" class="overlay">

              </div>
          
              <div class="card">
                <img src="rpics/p4.png" alt="Description 4" class="grid-pic">
                <img src="rcards/pic4.png" alt="Description 1" class="overlay">

              </div>
          
            </div>
          </div>
          <div>
            <img src="btn/prev.png" class="prev">
          </div>
          <div>
            <img src="btn/next.png" class="next">
          </div>
          <div>
            <img src="btn/search.png" class="search" id="search-btn" alt="Search">
          </div>      
          
          <div id="pickModal" class="modal">
            <div class="modal-content"><form id="search-form">
              <h1>Search Recipes</h1>

              <div class="search-input-group">
                <input type="text" id="search-input" placeholder="What are you craving? ">
              </div>
            
              <div class="keyword-group">
                <p>Popular Keywords:</p>
                <div class="keywords">
                  <span class="keyword-tag">Breakfast</span>
                  <span class="keyword-tag">Vegan</span>
                  <span class="keyword-tag">Dessert</span>
                  <span class="keyword-tag">Quick and Easy</span>
                  <span class="keyword-tag">Dinner</span>
                </div>
              </div>
            
              <button type="submit" class="submit-btn">Search Recipes</button>
            </form>
              <button class="modal-close" type="button">x</button>
              </div>
          </div>
          <script src="recipe.js"></script>
            </body>
