<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Login Page</title>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        
        <header class="nav_style w-100">
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <a class="navbar-brand title_font" href="home.html">The Cookbook</a>
                    <button class="navbar-toggler nav_style" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                        <div class="navbar-nav ms-auto">
                            <a class="nav-link nav_style" href="../recipes/recipe.html">Recipes</a>
                            <a class="nav-link nav_style" href="shopping_list.html">Shopping List</a>
                            <a class="nav-link nav_style" href="../home/index.html">My Profile</a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main class="login-main">
            <div class="wrapper">
                <form action="">
                    <img src="login.png" alt="Login Icon">
                    
                    <div class="input-box">
                        <input class="email" type="email" placeholder="Email" required>
                    </div>
                    
                    <div class="input-box">
                        <input type="password" placeholder="Password" required>
                    </div>
                    
                    <div class="remember-forgot">
                        <a href="#">Forgot password<span id="question-mark">?</span></a>
                    </div>
                    
                    <button type="submit" class="btn">Sign In</button>
                    
                    <div class="register-link">
                        <p>
                            Don't have an account<span id="question-mark">?</span>
                            <a href="createAccount.html">Register</a>
                        </p>
                    </div>
                </form>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
